services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: whatcook-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-whatcook}
      POSTGRES_USER: ${POSTGRES_USER:-whatcook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatcook} -d ${POSTGRES_DB:-whatcook}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 2. Database Migrations (golang-migrate)
  # ----------------------------------------------------------------------------
  migrate:
    image: migrate/migrate:v4.18.2
    container_name: whatcook-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-whatcook}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-whatcook}?sslmode=disable
      - up
    restart: "no"

  # ----------------------------------------------------------------------------
  # 3. Golang Backend (Gin REST API)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatcook-backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-whatcook}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-whatcook}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GIN_MODE: ${GIN_MODE:-release}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?Set VAPID_PUBLIC_KEY in .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?Set VAPID_PRIVATE_KEY in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@whatcook.app}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  libretranslate:
    profiles: [translation]
    image: libretranslate/libretranslate:latest
    container_name: whatcook-libretranslate
    command: ["--load-only", "en,ru", "--disable-web-ui", "--req-limit", "30", "--translation-cache", "all"]
    ports:
      - "127.0.0.1:${LIBRETRANSLATE_PORT:-5000}:5000"
    volumes:
      - libretranslate_data:/home/libretranslate/.local
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 4. Vue 3 Frontend (PWA)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?Set public HTTPS VITE_API_URL in .env}
    container_name: whatcook-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  libretranslate_data:
